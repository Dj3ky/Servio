<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Indigo rounded background -->
  <rect width="32" height="32" rx="7" fill="#4F46E5"/>

  <!-- Wrench icon, centered at 16,16, scaled to fit -->
  <!-- Simplified gear: outer ring with teeth + inner hole -->
  <g fill="white" transform="translate(16,16)">
    <!-- Gear teeth via a polygon star-like shape -->
    <path d="
      M0,-9 L1.5,-7.5 L3,-8.5 L4,-6.5 L5.8,-7 L5.8,-4.8 L8,-4 L7,-2
      L9,0 L7,2 L8,4 L5.8,4.8 L5.8,7 L4,6.5 L3,8.5 L1.5,7.5
      L0,9 L-1.5,7.5 L-3,8.5 L-4,6.5 L-5.8,7 L-5.8,4.8 L-8,4 L-7,2
      L-9,0 L-7,-2 L-8,-4 L-5.8,-4.8 L-5.8,-7 L-4,-6.5 L-3,-8.5 L-1.5,-7.5 Z
    " opacity="0.95"/>
    <!-- Inner circle cutout (hole in gear) -->
    <circle r="3.5" fill="#4F46E5"/>
  </g>
</svg>
